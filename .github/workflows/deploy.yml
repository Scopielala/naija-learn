# =============================================================
# Naija Learn — CI/CD Deployment Workflow
# =============================================================
# This workflow automatically builds and pushes a Docker image
# to GitHub Container Registry (GHCR) whenever code is pushed
# to the main branch.
#
# Railway watches GHCR for new images and redeploys
# automatically — zero manual steps needed.
#
# Triggers:
#   - Push to main branch  → builds and deploys latest
#   - Git tag (v*.*.*)     → builds and deploys with version tag
# =============================================================

name: Build and Deploy

on:
  push:
    # Trigger workflow on every push to main
    branches:
      - main
    # Also trigger when a version tag is pushed
    # v1.0.0, v1.1.0, v2.0.0 etc
    tags:
      - "v*.*.*"

# Permissions needed for GHCR
# contents:read  → checkout the code
# packages:write → push images to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Run this job on GitHub's Ubuntu Linux runner
    # This is a fresh virtual machine provided by GitHub
    # for free — clean environment every time
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # STEP 1 — Checkout Code
      # ---------------------------------------------------------
      # Downloads your repository code onto the runner machine.
      # Without this the runner has no code to build.
      # actions/checkout is an official GitHub Action.
      # @v4 is the version — always pin to a version for stability
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # STEP 2 — Extract Metadata
      # ---------------------------------------------------------
      # Automatically generates Docker image tags and labels.
      #
      # For a push to main it generates:
      #   ghcr.io/scopielala/naija-learn:latest
      #   ghcr.io/scopielala/naija-learn:sha-abc1234
      #
      # For a git tag push (v1.0.0) it also generates:
      #   ghcr.io/scopielala/naija-learn:v1.0.0
      #   ghcr.io/scopielala/naija-learn:1.0.0
      #
      # id: meta — gives this step a name so later steps
      # can reference its outputs using ${{ steps.meta.outputs.* }}
      # ---------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # The image name on GHCR
          # ghcr.io/scopielala/naija-learn
          images: ghcr.io/${{ github.repository }}

          tags: |
            # Always tag as latest on main branch pushes
            type=raw,value=latest,enable={{is_default_branch}}

            # Tag with short commit SHA
            # e.g. sha-abc1234
            type=sha,prefix=sha-

            # Tag with semantic version when a git tag is pushed
            # e.g. v1.0.0 becomes tags: v1.0.0 and 1.0.0
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # ---------------------------------------------------------
      # STEP 3 — Set Up Docker Buildx
      # ---------------------------------------------------------
      # Buildx is Docker's extended build tool.
      # It enables:
      # - Multi-platform builds (arm64 for Apple Silicon etc)
      # - Better caching
      # - Faster builds
      #
      # We set it up even if we only build for one platform
      # because it gives us access to better caching options.
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # STEP 4 — Login to GHCR
      # ---------------------------------------------------------
      # Authenticates Docker to push images to GHCR.
      #
      # registry: ghcr.io → GitHub Container Registry
      # username: github.actor → the GitHub user running the workflow
      #           this is automatically set by GitHub
      # password: secrets.GHCR_TOKEN → the Personal Access Token
      #           we created and stored as a GitHub Secret
      #           secrets.GHCR_TOKEN reads from repo secrets
      #           the actual token value is never visible in logs
      # ---------------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ---------------------------------------------------------
      # STEP 5 — Build and Push Docker Image
      # ---------------------------------------------------------
      # Builds the Docker image using our Dockerfile and
      # pushes it to GHCR in one step.
      #
      # context: . → build from the current directory
      #              (the root of the repo)
      #
      # file: Dockerfile → use our Dockerfile explicitly
      #
      # push: true → push to GHCR after building
      #              set to false if you only want to build
      #              without pushing (useful for testing)
      #
      # tags: steps.meta.outputs.tags → use all the tags
      #        generated by the metadata step above
      #
      # labels: steps.meta.outputs.labels → add standard
      #          OCI labels to the image (author, version etc)
      #
      # cache-from / cache-to → Docker layer caching
      #   Stores build cache on GHCR so subsequent builds
      #   reuse unchanged layers — much faster builds
      #   First build: 3-5 minutes
      #   Subsequent builds: 30-60 seconds (unchanged layers cached)
      # ---------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
