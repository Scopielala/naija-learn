<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered notes, summaries and practice questions organized around the official WAEC syllabus. Built for Nigerian students.">
    <meta name="theme-color" content="#1a5c38">

    <title>Naija Learn — Study smarter. Exam ready.</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

    <!-- Google Fonts — Inter for clean readable typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS — loaded in order of dependency -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/screens.css">
</head>

<body>

    <!-- App Header — visible on all screens -->
    <header class="app-header">
        <div class="app-header-inner">
            <span class="app-logo" role="button" tabindex="0" aria-label="Go to home screen">
                📚 Naija Learn
            </span>
        </div>
    </header>

    <!-- App Container — all screen content renders here -->
    <!-- JavaScript controls everything inside this div -->
    <main id="app" role="main" aria-live="polite">
        <!-- Content injected by JavaScript -->
    </main>

    <!-- JavaScript — loaded in strict dependency order -->
    <!-- Each file depends on the ones above it -->
    <script src="js/config.js?v=2"></script>
    <script src="js/state.js?v=2"></script>
    <script src="js/router.js?v=2"></script>
    <script src="js/api.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script src="js/screens.js?v=2"></script>
    <script src="js/events.js?v=2"></script>
    <script src="js/app.js?v=2"></script>

</body>

</html>
